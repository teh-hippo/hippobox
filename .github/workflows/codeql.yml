name: CodeQL

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 18 * * 3"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    uses: teh-hippo/common-repo-configs/.github/workflows/codeql.yml@5ee35e8b64328a970f0a85b963147b2b7e351886  # v2
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      language: rust
